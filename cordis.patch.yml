# dsh-minimal-router · 一个包，三个模块
# 顶层必须是数组；新增插件写 - insert: 再挂一个列表。
- insert:
    - id: minimal-router
      name: '@local/dsh-minimal-router'
      config:
        # ======================================================================
        # 模块开关（高级用户可以单独裁掉某一块，不用拆包）
        # ======================================================================
        guardEnabled: true # 熔断器：连续 N 次工具失败就中断
        probeEnabled: true # 缓存探针：记录真实 token 账单（看省钱效果必须开）

        # ======================================================================
        # 路由模块
        # ======================================================================
        # 【修改这里】没有命中任何关键词时的阶段；'auto' = 只提示不拦截（零摩擦）
        defaultStage: auto
        # 是否启用阶段越界拦截（false = 只提示不拦）
        enforceStage: true
        # 是否用 restrict() 物理砍掉不属于当前阶段的工具（省 token 的关键）
        enforceByRestrict: true
        # 本地体检模式：deny 拦截 / warn 只记日志 / off 关闭
        lintMode: deny
        # 安全闸门：上次请求超过这个 token 数就拦住切阶段（0 = 关闭）
        contextGuardThreshold: 100000
        # 降级保护：只有确认模型支持"系统提示追加到历史"才开尾插
        # 开源给别人用时必须保持 true
        requireInHistoryUpdates: true
        # 本地代理 / 自定义模型白名单（确认支持 in-history 再往里加）
        trustedModels: []
        # 明知有风险也要强开（自担风险）
        unsafeForce: false
        # 演示用：强制假装当前模型是这个名字（录视频演示降级保护，不花钱）
        simulateModel: ''

        # ======================================================================
        # 熔断模块（只在 guardEnabled: true 时生效）
        # ======================================================================
        guard:
          # 【修改这里】连续报错几次触发熔断
          maxConsecutiveErrors: 3
          enabled: true

        # ======================================================================
        # 探针模块（只在 probeEnabled: true 时生效）
        # ======================================================================
        probe:
          # 留空 = 落在包目录下的 data/usage.jsonl
          dataFile: ''
          # 每次请求在控制台打一行（长期用建议关掉）
          logToConsole: true
          # report 默认返回最近多少条
          reportLimit: 20
