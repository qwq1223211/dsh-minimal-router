name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三个平台都要过：Windows 的路径/盘符、macOS 的 ~、Linux 的大小写敏感，
        # 三者出问题的姿势各不相同，只测一个平台等于没测。
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20 = 当前 LTS，22 = 下一代 LTS。两个都过，说明没踩版本边角。
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 这个包是零依赖的：不需要 npm install，直接跑。
      - name: 环境
        run: node --version

      # 分五步跑，失败时能一眼看出是哪个模块挂了。
      - name: router
        run: node test/router.test.mjs

      - name: guard
        run: node test/guard.test.mjs

      - name: probe
        run: node test/probe.test.mjs

      # v1.16 的三个"更聪明"模块：语义打分 / 空转画像 / 自适应
      - name: intent
        run: node test/intent.test.mjs

      - name: usage
        run: node test/usage.test.mjs

      - name: adaptive
        run: node test/adaptive.test.mjs

      - name: activity
        run: node test/activity.test.mjs

      - name: feedback
        run: node test/feedback.test.mjs

      # 模糊测试：约 8400 个确定性随机输入，验证"绝不抛异常 + 不变量成立"
      - name: fuzz
        run: node test/fuzz.test.mjs

      # 旧版数据搬家：伪造 HOME + 真实旧布局，端到端验证"一条不丢"
      - name: migration
        run: node test/migration.test.mjs

      # 仓库自检：编码/BOM/CRLF、package.json 一致性、库代码不打 stdout、体积守卫
      - name: lint
        run: node scripts/lint.mjs

      # 依赖与入口体检：零依赖、main/exports 一致、files 覆盖运行时文件、
      # engines.dsh 合法、写盘路径在包外、无写操作指向包内
      - name: audit-deps
        run: node scripts/audit-deps.mjs

      # 模拟"别人装上去"：只复制 files 声明的文件到临时目录，再从那里 import + apply
      - name: install-elsewhere
        run: node test/install-elsewhere.test.mjs

  # ---------------------------------------------------------------------------
  # 覆盖率：用 Node 内置的 V8 coverage（零依赖，不装 c8）。
  # 只跑 ubuntu：它要 spawn 6 个子进程，没必要在三个平台各跑一遍。
  # ---------------------------------------------------------------------------
  coverage:
    name: 行覆盖率 · ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 行覆盖率（阈值 85%）
        run: node scripts/coverage.mjs --min 85

  # ---------------------------------------------------------------------------
  # 跨平台专项：上面是"单元测试在别的系统也能跑"，这里是"数据目录在两个系统上都写得进去"。
  # 路径拼接（homedir/join）和 ~/.dsh 的创建是真实用户会踩的坑，值得单独验一次。
  # ---------------------------------------------------------------------------
  cross-platform:
    name: 路径专项 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 数据目录默认落在用户目录，且能创建
        shell: bash
        run: |
          node --input-type=module -e "
          import { STATE_DIR, pickProbeDataFile } from './index.js';
          import { mkdirSync } from 'node:fs';
          const target = pickProbeDataFile({ dataFile: '' });
          console.log('STATE_DIR      :', STATE_DIR);
          console.log('探针默认数据文件:', target);
          if (target.includes('node_modules') || target.includes('.pnpm')) {
            throw new Error('数据文件不该落在依赖目录里');
          }
          mkdirSync(STATE_DIR, { recursive: true });
          console.log('用户目录可创建: OK');
          "

      - name: 中文与空格路径下也能加载
        shell: bash
        run: |
          mkdir -p "测试 目录/子 目录"
          node --input-type=module -e "
          import { mkdirSync, writeFileSync, rmSync } from 'node:fs';
          import { loadCustomStagesSync } from './lib/stages-config.js';
          const p = '测试 目录/子 目录/custom_stages.json';
          writeFileSync(p, JSON.stringify({ stages: { core: { allow: [] } } }), 'utf8');
          const out = loadCustomStagesSync(p);
          console.log('中文路径加载 ok =', out.ok);
          if (!out.ok) throw new Error('中文/空格路径加载失败: ' + JSON.stringify(out.errors));
          rmSync('测试 目录', { recursive: true, force: true });
          "
