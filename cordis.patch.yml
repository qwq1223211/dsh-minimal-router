# dsh-minimal-router · 一个包，三个模块
# 顶层必须是数组；新增插件写 - insert: 再挂一个列表。
- insert:
    - id: minimal-router
      name: '@local/dsh-minimal-router'
      config:
        # ======================================================================
        # 模块开关（高级用户可以单独裁掉某一块，不用拆包）
        # ======================================================================
        guardEnabled: true # 熔断器：连续 N 次工具失败就中断
        probeEnabled: true # 缓存探针：记录真实 token 账单（看省钱效果必须开）
        # @experimental 多领域并集：默认关闭。
        # 实测并集阶段的工具声明 ≈ 单阶段的 3 倍（134KB vs 46KB），
        # 本插件主打"瘦身"，所以默认不激活；只在你真的要做复合任务时才改成 true。
        unionEnabled: false

        # ======================================================================
        # 路由模块
        # ======================================================================
        # 【修改这里】没有命中任何关键词时的阶段；'auto' = 只提示不拦截（零摩擦）
        defaultStage: auto
        # 是否启用阶段越界拦截（false = 只提示不拦）
        enforceStage: true
        # 是否用 restrict() 物理砍掉不属于当前阶段的工具（省 token 的关键）
        enforceByRestrict: true
        # 裁剪模式：deny = 摘掉不要的（默认） / allow = 只留要的
        # deny 依赖"注册表有多大"，实测会算错（按 138 算 deny=100，作用在 172 的全局表上，实际剩 72）；
        # allow 不关心总数，结果可预测。想更确定就切 allow。
        restrictMode: deny
        # 本地体检模式：deny 拦截 / warn 只记日志 / off 关闭
        lintMode: deny
        # 安全闸门：上次请求超过这个 token 数就拦住切阶段（0 = 关闭）
        contextGuardThreshold: 100000
        # 迟滞：随口提到的关键词要连续几次指向同一阶段才真的切（1 = 不迟滞）
        switchConfirmations: 2
        # 冷却：刚切过一次之后，多少毫秒内不再自动切换（0 = 关闭）
        # 60 秒是量出来的：88 次真实切换里 71% 的相邻切换发生在 60 秒内
        switchCooldownMs: 60000
        # 时间窗：两次关键词信号隔太久就当新任务重新计数（默认 5 分钟 > 实测 P75）
        switchConfirmWindowMs: 300000
        # 成本闸门：自动切换前先算"几轮能回本"，超过这个轮数就不切
        costGateEnabled: true
        switchPaybackTurns: 3
        # 保守系数：重建成本 = 上下文 × 这个比例（1.0 = 最坏情况；实测平均 0.465）
        switchCostRatio: 1.0
        # 每字节工具声明折算多少 token（实测 98,778 字节 ≈ 29,800 token）
        switchSavingsPerByte: 0.3
        # 降级保护：只有确认模型支持"系统提示追加到历史"才开尾插
        # 开源给别人用时必须保持 true
        requireInHistoryUpdates: true
        # 本地代理 / 自定义模型白名单（确认支持 in-history 再往里加）
        trustedModels: []
        # 明知有风险也要强开（自担风险）
        unsafeForce: false
        # 演示用：强制假装当前模型是这个名字（录视频演示降级保护，不花钱）
        simulateModel: ''

        # ======================================================================
        # 熔断模块（只在 guardEnabled: true 时生效）
        # ======================================================================
        guard:
          # 【修改这里】连续报错几次触发熔断
          maxConsecutiveErrors: 3
          enabled: true

        # ======================================================================
        # 探针模块（只在 probeEnabled: true 时生效）
        # ======================================================================
        probe:
          # 留空 = 落在 ~/.dsh/minimal-router/usage.jsonl（包外面，重装不会丢）
          dataFile: ''
          # 每次请求在控制台打一行（长期用建议关掉）
          logToConsole: true
          # report 默认返回最近多少条
          reportLimit: 20
